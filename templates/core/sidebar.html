<aside class="sidebar" id="sidebar">
  <a href="{% url 'dashboard' %}" class="sidebar-brand">
    <i data-lucide="folder"></i>
    <span>مركز الملفات</span>
  </a>

  <nav class="sidebar-nav" aria-label="التنقل الرئيسي">
    <a
      href="{% url 'dashboard' %}"
      class="{% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'admin_dashboard' or request.resolver_match.url_name == 'staff_dashboard' %}active{% endif %}"
    >
      <i data-lucide="house"></i>
      <span>لوحة التحكم</span>
    </a>

    <a
      href="{% url 'document_list' %}"
      class="{% if request.resolver_match.url_name == 'document_list' %}active{% endif %}"
    >
      <i data-lucide="file-text"></i>
      <span>المستندات</span>
    </a>

    {% if role == "admin" or role == "staff" %}
      <a
        href="{% url 'upload_document' %}"
        class="{% if request.resolver_match.url_name == 'upload_document' %}active{% endif %}"
      >
        <i data-lucide="cloud-upload"></i>
        <span>رفع مستند</span>
      </a>
    {% endif %}

    <a
      href="{% url 'task_list' %}"
      class="{% if request.resolver_match.url_name == 'task_list' or request.resolver_match.url_name == 'task_detail' or request.resolver_match.url_name == 'add_task' %}active{% endif %}"
    >
      <i data-lucide="clipboard-check"></i>
      <span>المهام</span>
    </a>

    <a
      href="{% url 'client_list' %}"
      class="{% if request.resolver_match.url_name == 'client_list' or request.resolver_match.url_name == 'client_tasks' %}active{% endif %}"
    >
      <i data-lucide="users-round"></i>
      <span>العملاء</span>
    </a>

    {% if role == "admin" %}
      <a
        href="{% url 'reports' %}"
        class="{% if request.resolver_match.url_name == 'reports' %}active{% endif %}"
      >
        <i data-lucide="chart-no-axes-column-increasing"></i>
        <span>التقارير</span>
      </a>

      <a
        href="{% url 'staff_list' %}"
        class="{% if request.resolver_match.url_name == 'staff_list' or request.resolver_match.url_name == 'users' or request.resolver_match.url_name == 'add_user' or request.resolver_match.url_name == 'edit_staff' %}active{% endif %}"
      >
        <i data-lucide="users"></i>
        <span>الموظفون</span>
      </a>
    {% endif %}

    <div class="sidebar-bottom">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">
          <i data-lucide="log-out"></i>
          <span>تسجيل الخروج</span>
        </button>
      </form>
    </div>
  </nav>
</aside>
